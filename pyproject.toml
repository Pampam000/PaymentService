[project]
name = "payment-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "litestar==2.25.0",
    "uvicorn==0.54.0",
    "asyncpg==0.32.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.6",
    "alembic==1.20.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["payment_service*"]

[project.scripts]
payment-service-migrate = "payment_service.migrate:main"

[tool.setuptools.package-data]
payment_service = ["migrations/script.py.mako"]
