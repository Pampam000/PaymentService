name: Checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: payment_service_test
          POSTGRES_USER: payment_service_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payment_service_test -d payment_service_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: development
      DATABASE_URL: postgresql://payment_service_test:test_password@127.0.0.1:5432/payment_service_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -e . -c constraints.txt
      - run: python -m pip install ruff pip-audit
      - run: python -m payment_service.migrate upgrade
      - run: python -m payment_service.migrate check
      - run: python -m ruff check --select E4,E7,E9,F payment_service tests scripts
      - run: python -m unittest discover -s tests -v
      - run: python -m pip_audit -r constraints.txt --no-deps --disable-pip
